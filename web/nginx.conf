# Painel e API na mesma origem: os cookies de sessão são SameSite=Strict.

# Log sem query string ($uri, não $request): documento ou token na URL nunca chegam ao log.
log_format sem_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /var/log/nginx/access.log sem_query;

  # A API manda os próprios cabeçalhos de segurança (internal/httpapi).
  location ~ ^/(painel|v1)/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA. CSP: só a própria origem. 'unsafe-inline' só em style-src: o Radix (react-remove-scroll) injeta uma
  # tag <style>; nenhum script inline é permitido. img-src data: é o QR code do TOTP (qrcode gera data URL).
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri /index.html;
  }
}
