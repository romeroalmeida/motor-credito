# Desenvolvimento local. Os segredos vêm do .env (copie de .env.example); sem eles o compose recusa subir.
name: motor-credito

services:
  postgres:
    image: postgres:17-alpine
    container_name: motor-credito-postgres
    environment:
      POSTGRES_DB: motor
      POSTGRES_USER: motor_dono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?defina POSTGRES_APP_PASSWORD no .env}
    ports:
      - "127.0.0.1:55432:5432"
    networks: [interna]
    volumes:
      - motor-credito-pg:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor_dono -d motor"]
      interval: 3s
      retries: 20

  api:
    build: .
    container_name: motor-credito-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AMBIENTE: ${AMBIENTE:-desenvolvimento}
      DATABASE_URL: postgres://motor_api:${POSTGRES_APP_PASSWORD}@postgres:5432/motor?sslmode=disable
      DATABASE_URL_MIGRACAO: postgres://motor_dono:${POSTGRES_PASSWORD}@postgres:5432/motor?sslmode=disable
      CHAVE_HMAC_DOC: ${CHAVE_HMAC_DOC:?defina CHAVE_HMAC_DOC no .env}
      CHAVE_CIFRA_DOC: ${CHAVE_CIFRA_DOC:?defina CHAVE_CIFRA_DOC no .env}
      COOKIE_INSEGURO_DEV: ${COOKIE_INSEGURO_DEV:-}
      SEED_DEMO: ${SEED_DEMO:-}
      # Origem pública do painel e da /v1 (o nginx serve as duas): link de convite e URL do simulador.
      URL_PAINEL: ${URL_PAINEL:-http://localhost:55173}
      # Demonstração com cadastro real de CNPJ (BrasilAPI); CPF e score seguem no simulado. simulado = sem rede.
      BUREAU_CNPJ: ${BUREAU_CNPJ:-brasilapi}
      # CPF: simulado por padrão (a cota do trial do Serpro é mínima). Para ligar: BUREAU_CPF=serpro-trial
      # (URL e chave públicas do trial) ou BUREAU_CPF=serpro com SERPRO_URL e SERPRO_CHAVE.
      BUREAU_CPF: ${BUREAU_CPF:-simulado}
      SERPRO_URL: ${SERPRO_URL:-}
      SERPRO_CHAVE: ${SERPRO_CHAVE:-}
      # Só o nginx (IP fixo abaixo) pode informar o IP do cliente por X-Forwarded-For. Quem chama a 58080
      # direto chega pelo gateway da rede, que não está na lista: o cabeçalho é ignorado.
      PROXIES_CONFIAVEIS: 10.213.47.10/32
    networks: [interna]
    ports:
      - "127.0.0.1:58080:8080"

  # Retenção LGPD sob demanda (não sobe com "up"): docker compose --profile retencao run --rm retencao
  # Agende no host, ex. todo dia às 03:10:  10 3 * * *  cd /caminho/motor-credito && docker compose --profile retencao run --rm retencao
  retencao:
    build: .
    profiles: [retencao]
    entrypoint: ["/retencao"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://motor_api:${POSTGRES_APP_PASSWORD}@postgres:5432/motor?sslmode=disable
      RETENCAO_DIAS: ${RETENCAO_DIAS:-1825}
    networks: [interna]

  # Painel e API na mesma origem (nginx repassa /painel e /v1): o cookie SameSite=Strict só funciona assim.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: motor-credito-web
    depends_on:
      - api
    networks:
      interna:
        ipv4_address: 10.213.47.10
    ports:
      - "127.0.0.1:55173:80"

networks:
  interna:
    ipam:
      config:
        - subnet: 10.213.47.0/24

volumes:
  motor-credito-pg:
